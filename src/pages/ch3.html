<h2>从“矩阵计算”转向“线性结构”</h2>
<p>回顾前两章，我们已经会：算行列式、做矩阵运算、用初等变换化简矩阵、判断可逆、解线性方程组。但有一些问题始终没有说清楚：</p>
<div class="stage-grid">
  <div class="box note"><span class="tag">问题一</span><p>方程组中有的方程是“多余”的（可以由别的方程推出），去掉它解不变。怎样精确地刻画“多余”？去掉多余方程后还剩几个？</p></div>
  <div class="box note"><span class="tag">问题二</span><p>§2.4 说相抵标准型 \(\begin{pmatrix}I_r&O\\O&O\end{pmatrix}\) 中的 \(r\) 是唯一确定的。为什么？\(r\) 到底代表什么？</p></div>
  <div class="box note"><span class="tag">问题三</span><p>方程组有无穷多解时，能不能用<b>有限个</b>解把全部解表示出来？</p></div>
</div>
<p>回答这些问题需要一套新的语言：<b>线性组合、线性相关、秩、基、维数、子空间</b>。这套语言不只适用于数组，也适用于多项式、矩阵、函数——只要它们能做加法和数乘。</p>

<h2>整章的主线</h2>
<ol class="flow">
  <li>先规定“数”从哪里来</li><li class="arr">→</li><li class="key">数域 \(\mathbb K\)</li><li class="arr">→</li><li>最具体的向量</li><li class="arr">→</li><li class="key">\(\mathbb K^n\)</li><li class="arr">→</li><li>抽掉坐标，只留加法与数乘</li><li class="arr">→</li><li class="key">线性空间 \(V\)</li><li class="arr">→</li><li>向量之间有无冗余</li><li class="arr">→</li><li class="key">线性相关 / 无关</li><li class="arr">→</li><li>真正独立的信息有多少</li><li class="arr">→</li><li class="key">秩、基、维数</li><li class="arr">→</li><li>用到矩阵的行与列</li><li class="arr">→</li><li class="key">矩阵的秩</li><li class="arr">→</li><li>选定基</li><li class="arr">→</li><li class="key">坐标、\(V\cong\mathbb K^n\)</li><li class="arr">→</li><li>换基</li><li class="arr">→</li><li class="key">过渡矩阵</li><li class="arr">→</li><li>空间内部的结构</li><li class="arr">→</li><li class="key">子空间、交、和、直和</li><li class="arr">→</li><li>应用到 \(Ax=\beta\)</li><li class="arr">→</li><li class="key">解 = 特解 + 齐次解空间</li>
</ol>

<div class="stage-grid">
  <div class="stage"><span class="sk">第一阶段 · §3.1 → §3.2</span><h3>数与向量</h3><p>线性组合里的系数从哪里取？最具体的向量怎样做加法和数乘？</p><p><a href="#s3-1">§3.1</a> · <a href="#s3-2">§3.2</a></p></div>

  <div class="stage"><span class="sk">第三阶段 · §3.5 → §3.6</span><h3>秩、基与维数</h3><p>一组向量中有多少个真正独立的方向？矩阵的行、列中包含多少独立信息？</p><p><a href="#s3-5">§3.5</a> · <a href="#s3-6">§3.6</a></p></div>

<h2>本章的三次抽象</h2>
<div class="stage-grid">
  <div class="box idea"><span class="tag">第一次 · 从点和坐标到向量</span><p>平面上的点 ↔ 有序数对 ↔ 以原点为起点的向量。把二维、三维几何向量推广到 \(\mathbb K^n\)：“向量”不再需要画出来。</p></div>
  <div class="box idea"><span class="tag">第二次 · 从 \(\mathbb K^n\) 到一般线性空间</span><p>不再关心“向量是不是一个数组”，只要求有加法和数乘、并满足八条运算规则。多项式、矩阵、函数都可以是“向量”。</p></div>
  <div class="box idea"><span class="tag">第三次 · 从个数到“有效信息”的个数</span><p>向量多不代表信息多。真正需要的是<b>线性无关向量的最大个数</b>——这引出秩、维数、矩阵的秩。</p></div>
</div>

<h2>本章应建立的三种基本思维</h2>
<div class="stage-grid">
  <div class="box idea"><span class="tag">思维一 · 结构比外形重要</span><p>只要满足同一套加法、数乘公理，就能用同一套理论。判断一个对象能否当“向量”，看运算规则，不看长相。</p></div>
  <div class="box idea"><span class="tag">思维二 · 一切化为方程组</span><p>线性表示 ⇔ 非齐次方程组有解；线性相关 ⇔ 齐次方程组有非零解；求坐标、求过渡矩阵、求交空间，最后都是解方程组。</p></div>
  <div class="box idea"><span class="tag">思维三 · 数“独立方向”的个数</span><p>秩、维数、矩阵的秩、解空间维数 \(n-r\)，都在数同一种东西：不能互相表示的方向有几个。</p></div>
</div>

<h2>统计学中的线性空间</h2>
<div class="box stat"><span class="tag">统计视角 · 这一章会反复用到</span>
  <ul>
    <li><b>线性相关 = 多重共线性</b>：设计矩阵 \(X\) 的列线性相关时，\(X'X\) 不可逆，回归系数不唯一（§3.4、§3.6）。</li>
    <li><b>秩 = 有效变量个数</b>：\(r(X)\) 是不能互相表示的解释变量的个数（§3.5、§3.6）。</li>
    <li><b>列空间</b>：拟合值 \(\hat y=X\hat\beta\) 一定落在 \(X\) 的列向量生成的子空间 \(L(X)\) 中，最小二乘就是把 \(y\) 投影到这个子空间（§3.9）。</li>
    <li><b>自由度 \(n-r\)</b>：残差落在一个 \(n-r(X)\) 维子空间里，这就是残差平方和的自由度（§3.10 的 \(n-r\)）。</li>
    <li><b>换基 = 变量变换</b>：把变量标准化、做主成分，都是换一组基来描述同一组数据（§3.8）。</li>
  </ul>
</div>
