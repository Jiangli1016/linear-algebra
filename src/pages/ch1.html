<h2>这一章到底在学什么</h2>
<p>表面上是在学“行列式怎么算”，教材真正的逻辑是一条从具体到抽象的链：</p>
<ol class="flow">
  <li>线性方程组</li><li class="arr">→</li><li>二阶行列式</li><li class="arr">→</li><li>三阶行列式</li><li class="arr">→</li><li>余子式与递归</li><li class="arr">→</li><li class="key">\(n\) 阶行列式</li><li class="arr">→</li><li>基本性质</li><li class="arr">→</li><li>按任意行、列展开与转置</li><li class="arr">→</li><li>Cramer 法则</li><li class="arr">→</li><li>高效计算</li><li class="arr">→</li><li>排列与逆序数</li><li class="arr">→</li><li>等价定义</li><li class="arr">→</li><li>Laplace 定理</li>
</ol>
<p>整章依次回答四个问题：</p>
<ol>
  <li><b>行列式为什么会出现？</b>它是解线性方程组时自然冒出来的那个“只由系数决定的量”。</li>
  <li><b>一般的 \(n\) 阶行列式怎么定义？</b>教材用递归：\(n\) 阶由 \(n-1\) 阶来定义。</li>
  <li><b>它有哪些结构性质，怎样高效计算？</b>8 条性质 + 展开定理 + 消元降阶。</li>
  <li><b>递归定义背后有没有更统一的表达？</b>有：\(n!\) 项的排列求和公式，以及更一般的 Laplace 展开。</li>
</ol>

<h2>三个阶段</h2>
<div class="stage-grid">
  <div class="stage"><span class="sk">第一阶段 · §1.1 → §1.3</span><h3>从具体到一般</h3><p>从二元、三元方程组里的具体量出发，逐步建立 \(n\) 阶行列式与它的 8 条性质。</p><p><a href="#s1-1">§1.1</a> · <a href="#s1-2">§1.2</a> · <a href="#s1-3">§1.3</a></p></div>
  <div class="stage"><span class="sk">第二阶段 · §1.3 → §1.5</span><h3>从定义到操作</h3><p>展开定理、转置、Cramer 法则，再把它们组合成真正好用的计算策略。</p><p><a href="#s1-4">§1.4</a> · <a href="#s1-5">§1.5</a></p></div>
  <div class="stage"><span class="sk">第三阶段 · §1.6 → §1.7</span><h3>从操作到结构</h3><p>用排列重新理解行列式；把“按一个元素展开”推广为“按 \(k\) 阶子式展开”。</p><p><a href="#s1-6">§1.6</a> · <a href="#s1-7">§1.7</a></p></div>
</div>

<h2>贯穿全章的两个思想</h2>
<div class="w-grid">
  <div class="box idea"><span class="tag">思想一 · 结构</span>
    <p>拿到一个行列式，先别急着算，先问：</p>
    <ul><li>有没有零？</li><li>有没有相同或成比例的行、列？</li><li>有没有公因子？</li><li>能不能通过行列变换制造零？</li><li>有没有三角形、Vandermonde、递推、分块结构？</li></ul>
  </div>
  <div class="box idea"><span class="tag">思想二 · 降阶</span>
    <p>行列式的计算本质上是不断地降低阶数：</p>
    <div class="boxed-eq">\[n\text{ 阶}\longrightarrow(n-1)\text{ 阶}\longrightarrow\cdots\longrightarrow 2\text{ 阶}\]</div>
    <p class="small">计算的标准动作：观察结构 → 适当变换 → 制造零 → 选择展开位置 → 降阶。</p>
  </div>
</div>

<h2>行列式与统计学</h2>
<div class="box stat"><span class="tag">统计视角</span>
  <p>本章每一节都放了一个与统计相关的例子，帮助你看到行列式以后会出现在哪里：</p>
  <ul>
    <li><b>线性回归</b>：正规方程 \(X^{\top}X\hat\beta=X^{\top}y\) 有唯一解，当且仅当 \(|X^{\top}X|\ne0\)；完全多重共线性就是 \(|X^{\top}X|=0\)。</li>
    <li><b>多元正态分布</b>：密度 \(\dfrac{1}{(2\pi)^{p/2}|\Sigma|^{1/2}}\exp\!\bigl(-\tfrac12(x-\mu)^{\top}\Sigma^{-1}(x-\mu)\bigr)\) 里有协方差矩阵的行列式。</li>
    <li><b>广义方差</b>：\(|\Sigma|\) 衡量多维数据“散开的体积”。</li>
    <li><b>变量变换</b>：多元随机变量换元时，密度要乘 Jacobian 行列式的绝对值。</li>
  </ul>
  <p class="small muted">现在不必看懂这些公式，学完本章再回来看，你会认出里面的行列式。</p>
</div>
