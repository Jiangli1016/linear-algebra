<h2>为什么在行列式之后学习矩阵</h2>
<p>首先要分清两件事：</p>
<div class="w-grid">
  <div class="box def"><span class="tag">矩阵</span><p>\(A=(a_{ij})_{m\times n}\) 是一个<b>对象</b>：一张有 \(m\) 行、\(n\) 列的数表，整体参与运算。</p></div>
  <div class="box def"><span class="tag">行列式</span><p>\(\det A=|A|\) 是由<b>方阵</b>算出来的<b>一个数</b>。长方阵没有行列式。</p></div>
</div>
<p>第二章的核心任务不是“再学一种新的计算符号”，而是<b>建立一种新的代数对象及其运算体系</b>。行列式在这一章里退居“工具”的位置：它告诉我们一个方阵能不能求逆，乘积的行列式怎样计算。</p>

<h2>整章的主逻辑</h2>
<ol class="flow">
  <li>矩阵是什么？</li><li class="arr">→</li><li>矩阵之间如何运算？</li><li class="arr">→</li><li>什么时候能“做除法”？</li><li class="arr">→</li><li class="key">逆矩阵</li><li class="arr">→</li><li>如何系统地化简而不改变问题的本质？</li><li class="arr">→</li><li class="key">初等变换、初等矩阵、矩阵相抵</li><li class="arr">→</li><li>与可逆性、行列式的关系？</li><li class="arr">→</li><li class="key">\(|AB|=|A||B|\)、初等变换法求逆</li><li class="arr">→</li><li>大矩阵怎样按结构拆开？</li><li class="arr">→</li><li class="key">分块矩阵与 Schur 补</li><li class="arr">→</li><li>乘法公式怎样推广到子式？</li><li class="arr">→</li><li class="key">Cauchy–Binet 公式</li>
</ol>

<h2>本章应建立的三种基本思维</h2>
<div class="stage-grid">
  <div class="box idea"><span class="tag">思维一 · 先看尺寸，再做运算</span>
    <p>矩阵不像普通的数。相加要求<b>同型</b>；相乘要求<b>前一个的列数 = 后一个的行数</b>：</p>
    <div class="boxed-eq">\[(m\times k)(k\times n)\longrightarrow m\times n.\]</div>
    <p class="small">做任何矩阵运算之前，先检查尺寸。</p>
  </div>
  <div class="box idea"><span class="tag">思维二 · 乘法一般不交换</span>
    <p>即使 \(AB\) 与 \(BA\) 都有意义，也一般有</p>
    <div class="boxed-eq">\[AB\ne BA.\]</div>
    <p class="small">这是矩阵代数与数的代数最根本的差别之一。由此还会失去消去律、普通的二项式公式。</p>
  </div>
  <div class="box idea"><span class="tag">思维三 · 化简要靠初等变换</span>
    <p>许多问题最终都化成：</p>
    <div class="boxed-eq">\[A\xrightarrow{\ \text{初等变换}\ }\text{简单形式}.\]</div>
    <p class="small">解方程组、判断可逆、求逆矩阵、判断相抵、计算行列式、化阶梯形，都是这一个动作。</p>
  </div>
</div>

<h2>统计学中的矩阵</h2>
<div class="box stat"><span class="tag">统计视角 · 这一章会反复用到</span>
  <ul>
    <li><b>数据矩阵</b>：\(n\) 个样品、\(p\) 个变量排成 \(n\times p\) 矩阵 \(X\)，每一行是一个观测，每一列是一个变量（§2.1）。</li>
    <li><b>矩阵乘法</b>：\(X'X\)、样本协方差矩阵 \(S=\frac{1}{n-1}X_c'X_c\)、线性组合 \(Xw\) 都是乘法（§2.2）。</li>
    <li><b>转移矩阵的幂</b>：马尔可夫链 \(k\) 步之后的分布是 \(\pi_0P^k\)（§2.2）。</li>
    <li><b>逆矩阵</b>：线性回归的最小二乘估计 \(\hat\beta=(X'X)^{-1}X'y\)；\(X'X\) 不可逆就是完全多重共线性（§2.3、§2.5）。</li>
    <li><b>分块矩阵</b>：多元正态的条件分布、偏相关，都用协方差矩阵的分块与 Schur 补 \(\Sigma_{22}-\Sigma_{21}\Sigma_{11}^{-1}\Sigma_{12}\)（§2.6）。</li>
    <li><b>Cauchy–Binet</b>：\(X'X\) 的行列式等于各子数据阵行列式的平方和，推出 Cauchy–Schwarz 不等式与“相关系数绝对值不超过 1”（*§2.7）。</li>
  </ul>
</div>

<details class="tnote"><summary>教学提示</summary><div class="dbody"><ul>
  <li>第一节课先让学生回答“矩阵和行列式有什么不同”，把“对象”与“数”分清楚，后面的很多错误（如 \(|2A|=2|A|\)、长方阵求行列式）都源于此。</li>
  <li>乘法的“尺寸口诀”要在每次课堂演算时都写出来，直到学生养成习惯。</li>
  <li>本章有两条“反序”规则 \((AB)'=B'A'\)、\((AB)^{-1}=B^{-1}A^{-1}\)，可以用“穿袜子、穿鞋，脱的时候先脱鞋”帮助记忆。</li>
</ul></div></details>
