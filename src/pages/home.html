<h2>课程章节</h2>
<p class="muted small">章节名称按教材目录排列。已上线的章节可直接进入；其余章节建设中，结构已经预留。</p>
<div class="chapters" data-widget="chapters"></div>

<h2>三种使用方式</h2>
<div class="stage-grid">
  <div class="stage"><span class="sk">课堂 · 投影</span><h3>放映模式（PPT）</h3><p>点右上角“放映”，当前小节自动切成一页页幻灯片，16:9 全屏。<b>← →</b> 翻页，<b>+ −</b> 放大缩小字号，点公式、矩阵或表格可单独放大，<b>N</b> 打开教师备注，<b>Esc</b> 退出。每页标出所属部分与“下一页”预告，到一节末尾自动接上下一节。</p></div>
  <div class="stage"><span class="sk">课后 · 自学</span><h3>讲义模式</h3><p>默认的阅读视图。手机上点左上角“目录”切换小节；例题解答逐步展开；练习题即时判分。勾选“学生视图”可隐藏教学提示。</p></div>
  <div class="stage"><span class="sk">复习 · 存档</span><h3>打印讲义 / PDF</h3><p>在独立网址或离线版中，打开“设置 → 打印本章讲义”，整章连同全部解答排成一份讲义，可直接打印或“另存为 PDF”。</p></div>
</div>

<h2>高等代数与统计学</h2>
<div class="box stat"><span class="tag">统计视角</span>
  <p>统计学的很多核心对象本身就是矩阵：数据矩阵 \(X\)、协方差矩阵 \(\Sigma\)、投影矩阵 \(H=X(X^{\top}X)^{-1}X^{\top}\)。线性回归、主成分分析、多元正态分布、时间序列，全都建立在这门课的语言之上。课件每一节都放了一个这样的联系，帮助你提前看到“学了以后用在哪”。</p>
</div>
